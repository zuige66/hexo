    - src: /img/moments/ds-real-users.jpg
      alt: 「你以为被 DeepSeek 限制的用户」对比「实际上被限制的用户」
    - src: /img/moments/ds-app-store.jpg
      alt: 应用商店评分 3.1，4 万条评论里 2 万条选了不推荐

