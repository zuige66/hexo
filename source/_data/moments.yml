# 动态（Moments）——短句、牢骚、随手记
#
# 与「文章」的区别：文章正式、成篇；动态随意、简短，就是发牢骚。
# 二者共用同一个归档页 /archives/，通过顶部切换按钮在「文章归档」与「动态」之间切换。
#
# 新增一条：复制下面的模板，放到列表**最前面**（越靠前显示越靠上）。
#
#   - date: '2026-10-19 12:00'
#     content: |
#       这里写内容，支持 **Markdown**：加粗、[链接](https://example.com)、`代码`、![图片](/img/xxx.png)
#
# 字段说明：
#   date    必填，建议加英文单引号写成字符串，格式 YYYY-MM-DD HH:mm（不写时间则只显示日期）
#   content 必填，正文，支持 Markdown 与 HTML

- date: '2026-10-20 12:00'
  content: |
    这是模板自带的一条示例动态，学会后删掉它，写上你自己的第一条。
